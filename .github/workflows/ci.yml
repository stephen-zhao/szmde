name: CI

# The full gate on every push to main and every pull request — what makes branch
# protection meaningful (see docs/ci-cd.md). Mirrors the local gate exactly.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Frontend gate (typecheck · build · tests · coverage · traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (svelte-check, 0 errors)
        run: npm run check
      - name: Production build (catches SvelteKit/Vite build breaks)
        run: npm run build
      - name: Unit + DOM tests with coverage (100%-lines threshold, vitest.config.ts)
        run: npm run test:coverage
      - name: Requirement ↔ test traceability
        run: npm run test:trace

  sdlc:
    name: SDLC (szsdlc views up to date · consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install szsdlc
        run: pip install zhaostephen-szsdlc
      # The generated views (docs/*.md) must match the entities. Regenerate and fail
      # if any committed view drifted — i.e. an entity was edited without running
      # `szsdlc sync`. Views are deterministic (no clock-derived fields), so every
      # generated view is checked and any diff is a real drift.
      - name: Generated views are up to date
        run: |
          szsdlc sync
          if ! git diff --exit-code; then
            echo "::error::szsdlc generated views are stale — run 'szsdlc sync' and commit the result."
            exit 1
          fi
      # Entity-graph consistency: broken links, missing parents, workflow violations,
      # unparseable frontmatter.
      - name: Entity consistency (szsdlc validate)
        run: szsdlc validate

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: windows-latest # matches the Windows release target; WebView2 preinstalled
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
