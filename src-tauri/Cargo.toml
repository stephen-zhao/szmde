[package]
name = "szmde"
version = "0.1.0"
description = "Stephen Zhao MarkDown Editor"
authors = ["Stephen Zhao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "szmde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Android SAF backend (REQ-MOBILE-3): file picker, read/write by content:// URI,
# DocumentFile metadata, and *persistable* URI permissions (the reopen-after-restart
# mechanism the official tauri-plugin-fs cannot supply — verified on-device, M6 S4
# Phase A). We call only its **Rust** API from our `saf_*` commands, so
# `default-features = false` drops the `commands` feature — its ~50 JS commands are
# NOT registered and its broad capability is NOT needed (least-privilege: nothing
# android-fs is reachable from the WebView). Requires tauri ^2.8.2 (we're on 2.11.3).
tauri-plugin-android-fs = { version = "28", default-features = false }
# Native HTTP (reqwest) for cloud egress that bypasses the webview CORS wall
# (M3 L2, Google token + Drive endpoints), and the system-browser opener for the
# OAuth consent page. Scoped by capabilities to only the googleapis hosts.
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Android OAuth redirect capture (REQ-CLOUD-1 parity, M6 S6b): the 127.0.0.1 loopback
# is invalid on mobile, so Drive sign-in returns via an https App Link that this plugin
# delivers to the frontend (onOpenUrl / getCurrent). Registered mobile-only; desktop
# keeps the loopback. Config lives in tauri.conf.json > plugins.deep-link.
tauri-plugin-deep-link = "2"
# spawn_blocking for the loopback accept (runs inside Tauri's tokio runtime).
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS secure store for OAuth tokens (REQ-SEC-1). v4's default `v1` feature bundles the
# desktop stores (Windows Credential Manager / Apple Keychain / Linux Secret Service);
# the v4 bump was also required to cross-compile for Android (v3 has no Android backend).
# ⚠️ v4 does NOT ship or auto-register an Android store — the companion
# `android-native-keyring-store` must be added as a cfg(android) dep AND registered as
# keyring-core's default store at startup (see run()'s Android setup hook, M6 S6a);
# without that, secure_* fails on Android with "No default store has been set". The
# secure_* command surface + the Entry::new/get/set/delete API are unchanged.
keyring = "4"

# single-instance is desktop-only; on mobile there is no second process to forward.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Android Keystore backend for `keyring` (REQ-SEC-1 parity, M6 S6a). keyring v4 ships
# no Android store; this crate (Android-Keystore-encrypted SharedPreferences over JNI,
# minSdk 24) provides one, registered as keyring-core's default store in run()'s Android
# setup hook. `keyring-core` is pulled in directly for `set_default_store` (keyring v4
# already depends on it transitively). ndk-context is initialized by Tauri's Android
# runtime, so no Kotlin init is needed.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"
